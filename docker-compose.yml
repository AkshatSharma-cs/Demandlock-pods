services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: demandlock
      POSTGRES_USER: demandlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demandlock -d demandlock"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://demandlock:${POSTGRES_PASSWORD:-change-me}@db:5432/demandlock
      ENABLE_LLM_EXTRACTION: ${ENABLE_LLM_EXTRACTION:-false}
      ENABLE_LLM_MODULE_DRAFTS: ${ENABLE_LLM_MODULE_DRAFTS:-false}
      ENABLE_ASR: ${ENABLE_ASR:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      SECRET_KEY: ${SECRET_KEY:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      POD_THRESHOLD: ${POD_THRESHOLD:-5}
      AUDIO_DIR: ${AUDIO_DIR:-./media/audio}
    volumes:
      - audio:/app/media/audio
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  audio:
